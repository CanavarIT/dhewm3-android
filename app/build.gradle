plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.classic.doom3'

    compileSdk 36

    // Set to the NDK version installed on your machine
    ndkVersion '29.0.14033849'

    defaultConfig {
        applicationId 'com.classic.doom3'

        minSdk 29
        targetSdk 34

        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding false
        dataBinding false
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
}